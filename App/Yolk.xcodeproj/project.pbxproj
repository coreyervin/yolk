			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Builds the CLI and embeds it in the bundle. Runs as a build phase rather\n# than from the Makefile after export, so Xcode signs the nested binary and\n# the outer bundle in the correct inside-out order — signing the app first and\n# then adding a binary invalidates the signature.\n#\n# Contents/Resources, never Contents/MacOS: the app executable is\n# Contents/MacOS/Yolk and macOS volumes are case-insensitive by default, so a\n# CLI named 'yolk' beside it is the *same file* and silently clobbers the app.\nset -eu\n\nSCRATCH=\"$DERIVED_FILE_DIR/yolk-cli\"\n\n# Match the app's architectures exactly. Without this SwiftPM builds for the\n# host only, and a universal app would ship a CLI that Intel Macs cannot run.\nARCH_FLAGS=\"\"\nfor arch in $ARCHS; do\n\tARCH_FLAGS=\"$ARCH_FLAGS --arch $arch\"\ndone\n\n# SwiftPM must not inherit Xcode's per-target build environment, or it tries to\n# build the package for the app's exact configuration and fails.\nenv -u SDKROOT -u TOOLCHAINS -u SWIFT_EXEC -u CONFIGURATION \\\n\tswift build \\\n\t\t--package-path \"$PROJECT_DIR/..\" \\\n\t\t--scratch-path \"$SCRATCH\" \\\n\t\t--configuration release \\\n\t\t--product yolk \\\n\t\t$ARCH_FLAGS\n\n# A universal build lands under apple/Products; a single-arch one does not.\nif [ -x \"$SCRATCH/apple/Products/Release/yolk\" ]; then\n\tBUILT=\"$SCRATCH/apple/Products/Release/yolk\"\nelse\n\tBUILT=\"$SCRATCH/release/yolk\"\nfi\n\nRESOURCES=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nDEST=\"$RESOURCES/yolk\"\nSTAMP=\"$DERIVED_FILE_DIR/embedded-yolk.sha\"\nNEW_SHA=$(shasum -a 256 \"$BUILT\" | awk '{print $1}')\n\n# This phase is alwaysOutOfDate, so it runs on every build — but Xcode only\n# re-signs the outer bundle when it believes something changed, and it does not\n# track this script's side effects. Rewriting an unchanged binary therefore\n# leaves the bundle's sealed hash for it stale, and the app then fails\n# codesign --verify --deep with \"a sealed resource is missing or invalid\".\n# So: touch nothing unless the CLI actually changed.\nif [ -f \"$DEST\" ] && [ -f \"$STAMP\" ] && [ \"$(cat \"$STAMP\")\" = \"$NEW_SHA\" ]; then\n\techo \"embedded CLI unchanged; leaving the sealed copy alone\"\n\texit 0\nfi\n\nmkdir -p \"$RESOURCES\"\ninstall -m 755 \"$BUILT\" \"$DEST\"\n\n# The nested binary must be signed in its own right. SwiftPM ad-hoc signs a\n# single-arch build, but lipo-ing several together leaves the result unsigned —\n# and Apple Silicon SIGKILLs unsigned arm64 executables. Xcode will not do this\n# for us either: it seals Contents/Resources as data, not as nested code.\nSIGN_IDENTITY=\"${CODE_SIGN_IDENTITY:--}\"\ncase \"$SIGN_IDENTITY\" in\n\t\"Developer ID\"*)\n\t\t# Notarization requires a secure timestamp on every executable.\n\t\tTIMESTAMP_FLAG=\"--timestamp\" ;;\n\t*)\n\t\t# Ad-hoc and self-signed local builds: never reach out to Apple's\n\t\t# timestamp server, which only slows the build down or fails.\n\t\tTIMESTAMP_FLAG=\"--timestamp=none\" ;;\nesac\ncodesign --force --sign \"$SIGN_IDENTITY\" --options runtime \"$TIMESTAMP_FLAG\" \"$DEST\"\nprintf '%s' \"$NEW_SHA\" > \"$STAMP\"\n\n# Re-seal the outer bundle now that its contents changed. Xcode signs after all\n# phases and will simply redo this when it runs, but it skips signing on an\n# incremental build where only the CLI changed — and then this is the signature\n# that counts.\ncodesign --force --sign \"$SIGN_IDENTITY\" --options runtime \"$TIMESTAMP_FLAG\" \\\n\t--entitlements \"$PROJECT_DIR/Yolk/Yolk.entitlements\" \\\n\t\"$CODESIGNING_FOLDER_PATH\"\n\necho \"embedded $(lipo -archs \"$DEST\") CLI at $DEST\"\n";
		};
